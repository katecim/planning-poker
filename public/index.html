<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gopher Planning Poker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
</head>
<body class="bg-halloween">

    <div class="container">
        <div id="login-screen">
            <h1>Gopher Planning Poker</h1>
            <p style="margin-bottom: 25px; opacity: 0.8;">Enter and start planning.</p>
            
            <form onsubmit="event.preventDefault(); joinGame();">
                <input type="text" id="username" placeholder="What's your name?" autocomplete="off"/>
                <br>
                <button type="submit">Enter Session</button>
            </form>
        </div>

        <div id="game-screen" class="hidden">
            <div class="header">
                <div>
                     <h2 style="margin-bottom: 5px;">Planning Session</h2>
                     <h3 id="session-status">Voting in progress...</h3>
                </div>
               
                <div id="round-controls">
                    <button class="btn-reveal" onclick="revealCards()">👁️ Reveal Cards</button>
                    <button class="btn-reset" onclick="resetGame()">🔄 New Round</button>
                </div>
            </div>

            <div class="deck" id="deck"></div>

            <div id="results" class="hidden">
                <h3>Team Average</h3>
                <span id="average-score">-</span>
            </div>

            <div class="participants">
                <h3>Participants</h3>
                <ul id="user-list"></ul>
            </div>
        </div>
    </div>
    
    <div class="header-actions hidden" id="logout-container">
        <button onclick="logout()" class="logout-btn">Leave Session</button>
    </div>

    <button id="dimecka-quiz-trigger" class="dimecka-quiz-trigger hidden" type="button">
        Don't click
    </button>

    <dialog id="dimecka-quiz-dialog" class="dimecka-quiz-dialog">
        <div class="dimecka-quiz-header">
            <button id="dimecka-quiz-close" class="dimecka-quiz-close" type="button" aria-label="Close quiz">×</button>
        </div>
        <p id="dimecka-quiz-question">Did you miss me?</p>
        <div id="dimecka-quiz-actions" class="dimecka-quiz-actions">
            <button id="dimecka-quiz-yes" type="button">Yes</button>
            <button id="dimecka-quiz-no" type="button">No</button>
        </div>
    </dialog>

    <dialog id="dad-joke-dialog" class="dad-joke-dialog" aria-labelledby="dad-joke-title">
        <div class="dad-joke-header">
            <h2 id="dad-joke-title">Dad joke of the day</h2>
            <button id="dad-joke-close" class="dad-joke-close" type="button" aria-label="Close dad joke">×</button>
        </div>
        <p id="dad-joke-status" class="dad-joke-status" role="status" aria-live="polite"></p>
        <p id="dad-joke-text" class="dad-joke-text"></p>
    </dialog>

    <div id="background-controls" class="bg-widget hidden">
        <button class="bg-btn selected" data-bg="halloween" title="Halloween">🎃</button>
        <button class="bg-btn" data-bg="gopher" title="gopher">🦫</button>
        <button class="bg-btn" data-bg="casino" title="Poker Table">🎲</button>
    </div>

    <div class="reaction-bar hidden" id="emoji-controls"></div>
    
    <div id="floating-container"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
    
</body>
</html>
